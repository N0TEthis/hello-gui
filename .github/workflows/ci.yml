name: Go GUI CI/CD

on:
  push:
    branches: [ main ]
    tags: ['v*']
  pull_request:

jobs:
  # ==========================================
  # CI — форматирование, vet, тесты
  # ==========================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols

      - name: Format check
        run: |
          UNFORMATTED=$(gofmt -l .)

          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Не отформатировано:"
            echo "$UNFORMATTED"
            echo "Запустите: gofmt -w ."
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Tests
        run: go test ./... -v

      - name: Build smoke test
        run: go build -o /tmp/hello-gui .


  # ==========================================
  # BUILD — сборка 3 бинарников
  # ==========================================
  build:
    needs: test

    if: startsWith(github.ref, 'refs/tags/v')

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: hello-gui-linux-x64

          - os: macos-14
            artifact: hello-gui-macos-arm64

          - os: windows-latest
            artifact: hello-gui-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      # ==========================================
      # Linux dependencies
      # ==========================================
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols

      # ==========================================
      # Windows MSYS2
      # ==========================================
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config

      - name: Set GCC for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gccPath = Join-Path $env:RUNNER_TEMP "msys64\mingw64\bin\gcc.exe"

          if (-not (Test-Path $gccPath)) {
            $gccPath = "C:\msys64\mingw64\bin\gcc.exe"
          }

          if (-not (Test-Path $gccPath)) {
            $found = Get-ChildItem `
              -Path $env:RUNNER_TEMP `
              -Filter "gcc.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -like "*mingw64*"
              } |
              Select-Object -First 1

            if ($found) {
              $gccPath = $found.FullName
            }
          }

          if (-not (Test-Path $gccPath)) {
            throw "gcc.exe not found"
          }

          Write-Host "Found gcc: $gccPath"

          $gccUnix = $gccPath -replace '\\', '/'
          $gccDir = (Split-Path $gccPath -Parent) -replace '\\', '/'

          echo "CC=$gccUnix" >> $env:GITHUB_ENV
          echo "$gccDir" >> $env:GITHUB_PATH

      # ==========================================
      # Build
      # ==========================================
      - name: Build GUI
        shell: bash
        env:
          CGO_ENABLED: 1
        run: |
          EXTRA_LDFLAGS=""

          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_LDFLAGS="-H windowsgui"
          fi

          go build \
            -ldflags="-s -w $EXTRA_LDFLAGS -X main.version=${{ github.ref_name }}" \
            -o "${{ matrix.artifact }}" .

          ls -lh "${{ matrix.artifact }}"

      # ==========================================
      # Upload artifact
      # ==========================================
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error


  # ==========================================
  # RELEASE — один job публикует ВСЕ файлы
  # ==========================================
  release:
    needs: build

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Show release files
        run: |
          echo "=== Files for release ==="
          ls -lah release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true